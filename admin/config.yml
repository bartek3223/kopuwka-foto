backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "galeria"
    label: "Galeria Taboru"
    files:
      - file: "galeria.json"
        label: "Wpisy w galerii"
        name: "galeria"
        fields:
          - label: "Lista zdjęć"
            name: "entries"
            widget: "list"
            fields:
              - {label: "Tytuł / Lokomotywa", name: "title", widget: "string"}
              - {label: "Kategoria", name: "kategoria", widget: "select", options: ["Elektryczne", "Spalinowe", "Parowe"]}
              - {label: "Seria", name: "seria", widget: "string", hint: "Np. EU07, EP09, Lyd1"}
              - {label: "Zdjęcie", name: "image", widget: "image"}
              - {label: "Opis", name: "body", widget: "text", required: false}
              - label: "Lokalizacja GPS"
                name: "lokalizacja"
                widget: "object"
                fields:
                  - {label: "Szerokość (lat)", name: "lat", widget: "number", value_type: "float", required: false}
                  - {label: "Długość (lng)", name: "lng", widget: "number", value_type: "float", required: false}
              - {label: "Wyróżnione na stronie głównej (Home)?", name: "featured", widget: "boolean", required: false, default: false}
