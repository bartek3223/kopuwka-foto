<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOPUWKA foto – Kolejowa galeria szlakowa</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }

        header {
            background-color: #1a1a1a;
            border-bottom: 3px solid #ffcc00;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area h1 {
            color: #ffcc00;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-area p {
            color: #888;
            font-size: 13px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #ffcc00;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Statystyki */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .number {
            color: #ffcc00;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #aaa;
            font-size: 14px;
        }

        /* Sekcja mapy */
        .section-title {
            color: #ffcc00;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .map-container {
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 40px;
        }

        #rail-map {
            width: 100%;
            height: 480px;
            border-radius: 6px;
            z-index: 1;
        }

        /* Stopka */
        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 13px;
            border-top: 1px solid #222;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>KOPUWKA foto</h1>
            <p>Kolejowa galeria szlakowa</p>
        </div>
        <nav>
            <a href="#home">Home</a>
            <a href="#mapa">Mapa</a>
            <a href="#zdjecia">Zdjęcia</a>
        </nav>
    </header>

    <div class="container">
        
        <!-- Pasek statystyk -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number">120+</div>
                <div class="label">Zdjęć w bazie</div>
            </div>
            <div class="stat-card">
                <div class="number">25</div>
                <div class="label">Oznaczeń taboru</div>
            </div>
            <div class="stat-card">
                <div class="number">14</div>
                <div class="label">Linii kolejowych</div>
            </div>
            <div class="stat-card">
                <div class="number">45</div>
                <div class="label">Miejscowości</div>
            </div>
        </div>

        <!-- Sekcja Mapy -->
        <div id="mapa">
            <div class="section-title">📍 Mapa wypraw i kadry szlakowe</div>
            <div class="map-container">
                <div id="rail-map"></div>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 KOPUWKA foto. Wszystkie prawa zastrzeżone.
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inicjalizacje mapy wyśrodkowanej na rejonie Twoich tras (Wielkopolska / okolice Śremu i KWB Konin)
        const map = L.map('rail-map').setView([52.1, 17.2], 9);

        // Podpięte kafelki z Twoim kluczem CartoDB API
        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4xrb_1_5f26e5dea6fd53fdef455be0', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        // Przykładowy znacznik punktu szlakowego – możesz dodawać kolejne
        const marker = L.marker([52.12, 17.15]).addTo(map);
        marker.bindPopup("<b>Kolejowy kadr szlakowy</b><br>Przykładowa lokomotywa w trasie.");
    </script>

</body>
</html>
