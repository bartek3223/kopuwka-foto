<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kopuwka foto – Galeria zdjęć</title>
    
    <!-- Styl mapy Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ffffff;
        }
        .admin-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .admin-link:hover {
            background-color: #0056b3;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #333;
        }
        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        .badge {
            display: inline-block;
            background-color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: #ffc107;
            width: fit-content;
        }
        .description {
            margin-bottom: 15px;
            color: #ccc;
            font-size: 0.95rem;
        }
        /* Kontener na mapę pod każdym zdjęciem */
        .map-box {
            width: 100%;
            height: 150px;
            border-radius: 4px;
            margin-top: auto;
            border: 1px solid #444;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>KOPUWKA foto – Galeria Taboru</h1>
        <p>Kolej w obiektywie</p>
        <a href="/admin/" class="admin-link">Panel Administracyjny</a>
    </header>

    <main>
        <div id="gallery" class="gallery-container">
            <div class="loading">Ładowanie galerii i map...</div>
        </div>
    </main>

    <!-- Skrypt Leaflet do obsługi map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        async function loadGallery() {
            const galleryEl = document.getElementById('gallery');
            const repo = "bartek3223/kopuwka-foto";
            const url = `https://api.github.com/repos/${repo}/contents/content/galeria`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Błąd pobierania danych");
                
                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    galleryEl.innerHTML = '<div class="loading">Brak wpisów w galerii. Dodaj pierwszy w panelu admina!</div>';
                    return;
                }

                galleryEl.innerHTML = '';

                // Przechodzimy przez każdy wpis
                for (let i = 0; i < mdFiles.length; i++) {
                    const file = mdFiles[i];
                    const fileResponse = await fetch(file.download_url);
                    const text = await fileResponse.text();
                    
                    const frontmatter = parseFrontmatter(text);
                    if (!frontmatter) continue;

                    const cardId = `card-${i}`;
                    const card = document.createElement('div');
                    card.className = 'card';

                    let imgHtml = frontmatter.image ? `<img src="${frontmatter.image}" alt="${frontmatter.title || 'Zdjęcie'}">` : '';
                    let categoryHtml = frontmatter.kategoria ? `<span class="badge">${frontmatter.kategoria} ${frontmatter.seria ? '('+frontmatter.seria+')' : ''}</span>` : '';
                    
                    card.innerHTML = `
                        ${imgHtml}
                        <div class="card-content">
                            ${categoryHtml}
                            <h3>${frontmatter.title || 'Bez tytułu'}</h3>
                            <div class="description">${frontmatter.body || ''}</div>
                            ${frontmatter.lokalizacja && frontmatter.lokalizacja.lat && frontmatter.lokalizacja.lng ? `<div id="map-${i}" class="map-box"></div>` : ''}
                        </div>
                    `;

                    galleryEl.appendChild(card);

                    // Jeśli są współrzędne GPS, renderujemy mapę Leaflet
                    if (frontmatter.lokalizacja && frontmatter.lokalizacja.lat && frontmatter.lokalizacja.lng) {
                        const lat = Number(frontmatter.lokalizacja.lat);
                        const lng = Number(frontmatter.lokalizacja.lng);
                        
                        // Małe opóźnienie, żeby DOM zdążył wyrenderować element div mapy
                        setTimeout(() => {
                            const map = L.map(`map-${i}`, {
                                zoomControl: false,
                                attributionControl: false
                            }).setView([lat, lng], 13);

                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                maxZoom: 19
                            }).addTo(map);

                            L.marker([lat, lng]).addTo(map);
                        }, 100);
                    }
                }

            } catch (error) {
                console.error(error);
                galleryEl.innerHTML = '<div class="loading">Nie udało się załadować wpisów.</div>';
            }
        }

        function parseFrontmatter(text) {
            const match = text.match(/^---\s*([\s\S]*?)\s*---([\s\S]*)$/);
            if (!match) return null;

            const yamlLines = match[1].split('\n');
            const body = match[2].trim();
            const data = { body: body };

            let parentKey = null;

            yamlLines.forEach(line => {
                const indentMatch = line.match(/^(\s*)/);
                const indent = indentMatch ? indentMatch[1].length : 0;
                const parts = line.split(':');
                if (parts.length < 2) return;

                const key = parts[0].trim();
                const value = parts.slice(1).join(':').trim().replace(/^['"](.*)['"]$/, '$1');

                if (indent === 0) {
                    if (value === '') {
                        parentKey = key;
                        data[key] = {};
                    } else {
                        data[key] = value;
                        parentKey = null;
                    }
                } else if (indent > 0 && parentKey) {
                    data[parentKey][key] = isNaN(value) ? value : Number(value);
                }
            });

            return data;
        }

        loadGallery();
    </script>
</body>
</html>
