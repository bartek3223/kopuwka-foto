<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kopuwka foto – Galeria Kolejowa</title>
    
    <!-- Styl mapy Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 25px 20px;
            background-color: #181818;
            border-bottom: 2px solid #333;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            color: #ffffff;
        }
        header p {
            color: #888;
            margin: 5px 0 10px 0;
        }
        
        /* Górne menu */
        nav {
            display: flex;
            justify-content: center;
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
        }
        nav button, nav a {
            background: none;
            border: none;
            color: #ccc;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        nav button:hover, nav button.active, nav a:hover {
            color: #ffc107;
            background-color: #252525;
            border-bottom: 3px solid #ffc107;
        }
        .admin-btn {
            background-color: #007bff !important;
            color: white !important;
            border-radius: 4px;
            margin: 10px;
            padding: 8px 15px !important;
            border-bottom: none !important;
        }

        /* Główne sekcje */
        .section {
            display: none;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section.active {
            display: block;
        }

        .home-section-title {
            font-size: 1.5rem;
            color: #ffc107;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .breadcrumb {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #888;
        }
        .breadcrumb button {
            background: none;
            border: none;
            color: #ffc107;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
            font-size: 0.95rem;
        }
        .breadcrumb button:hover {
            text-decoration: underline;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .menu-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .menu-box:hover {
            background-color: #252525;
            border-color: #ffc107;
            color: #ffc107;
            transform: translateY(-2px);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #333;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 8px 0;
            color: #fff;
            font-size: 1.1rem;
        }
        .badge {
            display: inline-block;
            background-color: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 8px;
            color: #ffc107;
        }
        .card-content p {
            margin: 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
            padding: 50px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>KOPUWKA foto – Galeria Taboru</h1>
        <p>Kolej w obiektywie</p>
    </header>

    <nav>
        <button onclick="switchMainTab('home')" id="nav-home" class="active">Home</button>
        <button onclick="switchMainTab('photos')" id="nav-photos">Zdjęcia</button>
        <button onclick="switchMainTab('map')" id="nav-map">Mapa</button>
        <a href="/admin/" class="admin-btn">Panel Admina</a>
    </nav>

    <!-- ZAKŁADKA: HOME -->
    <div id="tab-home" class="section active">
        <h2 class="home-section-title">✨ Wyróżnione / Najlepsze zdjęcia</h2>
        <div id="home-featured-grid" class="gallery-grid">
            <div class="loading">Ładowanie wyróżnionych zdjęć...</div>
        </div>

        <h2 class="home-section-title">🚂 Ostatnio dodane w trasy</h2>
        <div id="home-latest-grid" class="gallery-grid">
            <div class="loading">Ładowanie ostatnich zdjęć...</div>
        </div>
    </div>

    <!-- ZAKŁADKA: ZDJĘCIA -->
    <div id="tab-photos" class="section">
        <div id="view-categories">
            <h2>Wybierz kategorię taboru:</h2>
            <div class="menu-grid">
                <div class="menu-box" onclick="selectCategory('Elektryczne')">⚡ Elektryczne</div>
                <div class="menu-box" onclick="selectCategory('Spalinowe')">🚂 Spalinowe</div>
                <div class="menu-box" onclick="selectCategory('Parowe')">💨 Parowe</div>
            </div>
        </div>

        <div id="view-series" style="display: none;">
            <div class="breadcrumb">
                <button onclick="resetToCategories()">← Wróć do kategorii</button> / <span id="current-cat-name" style="color: #fff; font-weight: bold;"></span>
            </div>
            <h2>Wybierz serię lokomotywy:</h2>
            <div id="series-grid" class="menu-grid"></div>
        </div>

        <div id="view-gallery" style="display: none;">
            <div class="breadcrumb">
                <button onclick="resetToSeries()">← Wróć do serii</button> / <span id="current-path" style="color: #fff; font-weight: bold;"></span>
            </div>
            <div id="gallery-grid" class="gallery-grid"></div>
        </div>
    </div>

    <!-- ZAKŁADKA: MAPA -->
    <div id="tab-map" class="section">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let allEntries = [];
        let map = null;
        let markersLayer = null;
        let currentCategory = null;
        let currentSeries = null;

        async function fetchEntries() {
            const repo = "bartek3223/kopuwka-foto";
            const url = `https://api.github.com/repos/${repo}/contents/content/galeria`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Błąd pobierania");
                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                allEntries = [];
                for (const file of mdFiles) {
                    try {
                        const fileResponse = await fetch(file.download_url);
                        const text = await fileResponse.text();
                        const data = parseFrontmatter(text);
                        if (data) allEntries.push(data);
                    } catch (e) {
                        console.error("Błąd parsowania pliku:", file.name);
                    }
                }
                
                renderHomeTab();
                initMapMarkers();
            } catch (err) {
                console.error("Błąd ładowania wpisów:", err);
                document.getElementById('home-featured-grid').innerHTML = '<div class="loading">Błąd ładowania danych z GitHuba.</div>';
                document.getElementById('home-latest-grid').innerHTML = '<div class="loading">Błąd ładowania danych z GitHuba.</div>';
            }
        }

        function renderHomeTab() {
            const featuredGrid = document.getElementById('home-featured-grid');
            const latestGrid = document.getElementById('home-latest-grid');

            if (allEntries.length === 0) {
                featuredGrid.innerHTML = '<div class="loading">Brak wpisów w galerii. Dodaj pierwszy w panelu admina!</div>';
                latestGrid.innerHTML = '<div class="loading">Brak wpisów w galerii.</div>';
                return;
            }

            const featured = allEntries.filter(item => item.featured === true || item.featured === "true");
            const displayFeatured = featured.length > 0 ? featured : allEntries.slice(0, 3);

            featuredGrid.innerHTML = '';
            displayFeatured.forEach(item => {
                featuredGrid.appendChild(createCard(item));
            });

            latestGrid.innerHTML = '';
            allEntries.slice(0, 6).forEach(item => {
                latestGrid.appendChild(createCard(item));
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                ${item.image ? `<img src="${item.image}" alt="${item.title || 'Zdjęcie'}">` : ''}
                <div class="card-content">
                    ${item.kategoria ? `<span class="badge">${item.kategoria} ${item.seria ? '('+item.seria+')' : ''}</span>` : ''}
                    <h3>${item.title || 'Bez tytułu'}</h3>
                    <p>${item.body || ''}</p>
                </div>
            `;
            return card;
        }

        function switchMainTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            if (tab === 'home') {
                document.getElementById('tab-home').classList.add('active');
                document.getElementById('nav-home').classList.add('active');
            } else if (tab === 'photos') {
                document.getElementById('tab-photos').classList.add('active');
                document.getElementById('nav-photos').classList.add('active');
            } else if (tab === 'map') {
                document.getElementById('tab-map').classList.add('active');
                document.getElementById('nav-map').classList.add('active');
                setTimeout(() => { 
                    if (map) map.invalidateSize(); 
                }, 200);
            }
        }

        function selectCategory(category) {
            currentCategory = category;
            document.getElementById('current-cat-name').innerText = category;
            
            document.getElementById('view-categories').style.display = 'none';
            document.getElementById('view-series').style.display = 'block';

            const seriesSet = new Set();
            allEntries.forEach(item => {
                if (item.kategoria === category && item.seria) {
                    seriesSet.add(item.seria);
                }
            });

            const seriesGrid = document.getElementById('series-grid');
            seriesGrid.innerHTML = '';

            if (seriesSet.size === 0) {
                seriesGrid.innerHTML = '<div style="color: #888; grid-column: 1/-1;">Brak serii w tej kategorii.</div>';
                return;
            }

            seriesSet.forEach(seria => {
                const box = document.createElement('div');
                box.className = 'menu-box';
                box.innerText = seria;
                box.onclick = () => selectSeries(seria);
                seriesGrid.appendChild(box);
            });
        }

        function selectSeries(seria) {
            currentSeries = seria;
            document.getElementById('current-path').innerText = `${currentCategory} / ${seria}`;
            
            document.getElementById('view-series').style.display = 'none';
            document.getElementById('view-gallery').style.display = 'block';

            const galleryGrid = document.getElementById('gallery-grid');
            galleryGrid.innerHTML = '';

            const filtered = allEntries.filter(item => item.kategoria === currentCategory && item.seria === seria);
            filtered.forEach(item => {
                galleryGrid.appendChild(createCard(item));
            });
        }

        function resetToCategories() {
            currentCategory = null;
            document.getElementById('view-series').style.display = 'none';
            document.getElementById('view-categories').style.display = 'block';
        }

        function resetToSeries() {
            currentSeries = null;
            document.getElementById('view-gallery').style.display = 'none';
            document.getElementById('view-series').style.display = 'block';
        }

        function initMap() {
            if (map) return;
            map = L.map('map').setView([52.0, 19.0], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }

        function initMapMarkers() {
            initMap();
            markersLayer.clearLayers();

            allEntries.forEach(item => {
                if (item.lokalizacja && item.lokalizacja.lat && item.lokalizacja.lng) {
                    const lat = Number(item.lokalizacja.lat);
                    const lng = Number(item.lokalizacja.lng);

                    const marker = L.marker([lat, lng]);
                    let popupContent = `<div style="text-align: center; max-width: 200px;">`;
                    if (item.image) popupContent += `<img src="${item.image}" style="width:100%; height:120px; object-fit:cover; border-radius:4px; margin-bottom:5px;">`;
                    popupContent += `<strong>${item.title || 'Lokomotywa'}</strong><br><span style="font-size:0.85rem; color:#555;">${item.kategoria} (${item.seria || ''})</span></div>`;

                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                }
            });
        }

        function parseFrontmatter(text) {
            const match = text.match(/^---\s*([\s\S]*?)\s*---([\s\S]*)$/);
            if (!match) return null;

            const yamlLines = match[1].split('\n');
            const body = match[2].trim();
            const data = { body: body };
            let parentKey = null;

            yamlLines.forEach(line => {
                const indentMatch = line.match(/^(\s*)/);
                const indent = indentMatch ? indentMatch[1].length : 0;
                const parts = line.split(':');
                if (parts.length < 2) return;

                const key = parts[0].trim();
                const value = parts.slice(1).join(':').trim().replace(/^['"](.*)['"]$/, '$1');

                if (indent === 0) {
                    if (value === '') {
                        parentKey = key;
                        data[key] = {};
                    } else {
                        data[key] = value;
                        parentKey = null;
                    }
                } else if (indent > 0 && parentKey) {
                    data[parentKey][key] = isNaN(value) ? value : Number(value);
                }
            });

            return data;
        }

        fetchEntries();
    </script>
</body>
</html>
