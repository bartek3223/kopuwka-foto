<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kopuwka foto – Galeria Zdjęć</title>
    <!-- Proste style CSS, żeby galeria wyglądała czytelnie -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ffffff;
        }
        .admin-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .admin-link:hover {
            background-color: #0056b3;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #333;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin-top: 0;
            color: #ffffff;
        }
        .badge {
            display: inline-block;
            background-color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: #ffc107;
        }
        .map-info {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 10px;
            border-top: 1px solid #2a2a2a;
            padding-top: 8px;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>KOPUWKA foto – Galeria Taboru</h1>
        <p>Kolej w obiektywie</p>
        <a href="/admin/" class="admin-link">Panel Administracyjny</a>
    </header>

    <main>
        <div id="gallery" class="gallery-container">
            <div class="loading">Pobieranie zdjęć z galerii...</div>
        </div>
    </main>

    <!-- Skrypt pobierający wpisy z folderu content/galeria za pomocą GitHub API -->
    <script>
        async function loadGallery() {
            const galleryEl = document.getElementById('gallery');
            // Pobieramy listę plików z repozytorium GitHub dla folderu content/galeria
            const repo = "bartek3223/kopuwka-foto";
            const url = `https://api.github.com/repos/${repo}/contents/content/galeria`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Błąd pobierania danych");
                
                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    galleryEl.innerHTML = '<div class="loading">Brak wpisów w galerii. Dodaj pierwszy w panelu admina!</div>';
                    return;
                }

                galleryEl.innerHTML = '';

                for (const file of mdFiles) {
                    const fileResponse = await fetch(file.download_url);
                    const text = await fileResponse.text();
                    
                    // Parsowanie frontmatter (danych z nagłówka Markdown)
                    const frontmatter = parseFrontmatter(text);
                    if (!frontmatter) continue;

                    // Tworzenie karty dla każdego wpisu
                    const card = document.createElement('div');
                    card.className = 'card';

                    let imgHtml = frontmatter.image ? `<img src="${frontmatter.image}" alt="${frontmatter.title || 'Zdjęcie'}">` : '';
                    let categoryHtml = frontmatter.kategoria ? `<span class="badge">${frontmatter.kategoria} (${frontmatter.seria || ''})</span>` : '';
                    
                    let mapHtml = '';
                    if (frontmatter.lokalizacja && frontmatter.lokalizacja.lat && frontmatter.lokalizacja.lng) {
                        mapHtml = `<div class="map-info">📍 GPS: ${frontmatter.lokalizacja.lat}, ${frontmatter.lokalizacja.lng}</div>`;
                    }

                    card.innerHTML = `
                        ${imgHtml}
                        <div class="card-content">
                            ${categoryHtml}
                            <h3>${frontmatter.title || 'Bez tytułu'}</h3>
                            <p>${frontmatter.body || ''}</p>
                            ${mapHtml}
                        </div>
                    `;

                    galleryEl.appendChild(card);
                }

            } catch (error) {
                console.error(error);
                galleryEl.innerHTML = '<div class="loading">Nie udało się załadować wpisów.</div>';
            }
        }

        // Prosta funkcja do wyciągania danych YAML z pliku Markdown
        function parseFrontmatter(text) {
            const match = text.match(/^---\s*([\s\S]*?)\s*---([\s\S]*)$/);
            if (!match) return null;

            const yamlLines = match[1].split('\n');
            const body = match[2].trim();
            const data = { body: body };

            let currentObj = data;
            let parentKey = null;

            yamlLines.forEach(line => {
                const indentMatch = line.match(/^(\s*)/);
                const indent = indentMatch ? indentMatch[1].length : 0;
                const parts = line.split(':');
                if (parts.length < 2) return;

                const key = parts[0].trim();
                const value = parts.slice(1).join(':').trim().replace(/^['"](.*)['"]$/, '$1');

                if (indent === 0) {
                    if (value === '') {
                        parentKey = key;
                        data[key] = {};
                    } else {
                        data[key] = value;
                        parentKey = null;
                    }
                } else if (indent > 0 && parentKey) {
                    data[parentKey][key] = isNaN(value) ? value : Number(value);
                }
            });

            return data;
        }

        loadGallery();
    </script>

</body>
</html>
